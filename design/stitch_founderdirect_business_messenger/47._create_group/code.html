<script>
  const nameInput = document.getElementById('group-name');
  const charCount = document.getElementById('char-count');
  const createBtn = document.getElementById('create-btn');
  const checkboxes = document.querySelectorAll('input[type="checkbox"]');

  function updateState() {
    const len = nameInput.value.length;
    charCount.textContent = `${len}/20`;
    
    let isChecked = false;
    checkboxes.forEach(cb => {
      if(cb.checked) isChecked = true;
    });

    if (len > 0 && isChecked) {
      createBtn.removeAttribute('disabled');
    } else {
      createBtn.setAttribute('disabled', 'true');
    }
  }

  nameInput.addEventListener('input', updateState);
  checkboxes.forEach(cb => cb.addEventListener('change', updateState));
  
  // Initial state
  updateState();
  
  createBtn.addEventListener('click', () => {
    if(!createBtn.hasAttribute('disabled')) {
      createBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">sync</span>Creating...';
      setTimeout(() => {
        createBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span>Group Created';
        createBtn.classList.replace('bg-primary', 'bg-tertiary-container');
        createBtn.classList.replace('text-on-primary', 'text-on-tertiary-container');
      }, 800);
    }
  });
