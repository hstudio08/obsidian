<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-background"><div class="bg-pattern"></div><main class="relative min-h-screen"><div class="flex flex-col w-full h-full min-h-[100dvh] bg-surface relative justify-between pb-safe pt-safe" style="min-height: 100dvh;">
<!-- Abstract Ambient Background -->
<div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20 z-0">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad1" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:var(--primary);stop-opacity:0.05"></stop>
<stop offset="100%" style="stop-color:var(--primary);stop-opacity:0"></stop>
</lineargradient>
</defs>
<circle class="animate-pulse" cx="20%" cy="10%" fill="url(#grad1)" r="40%" style="animation-duration: 8s;"></circle>
<circle class="animate-pulse" cx="80%" cy="90%" fill="url(#grad1)" r="50%" style="animation-duration: 12s;"></circle>
</svg>
</div>
<div class="flex-1 flex flex-col justify-center items-center px-6 z-10 relative mt-16 mb-8">
<!-- Logo -->
<div class="w-24 h-24 mb-12 rounded-xl overflow-hidden shadow-sm bg-surface-container flex items-center justify-center transform transition-transform duration-700 hover:scale-105" id="logo-container">
<img alt="Obsidian Logo" class="w-16 h-16 object-contain mix-blend-multiply opacity-0 transition-opacity duration-1000 ease-out" id="obsidian-logo" onload="this.classList.remove('opacity-0')" src="https://lh3.googleusercontent.com/aida/AP1WRLtB8nMX-UuuNjn0CEbj6ugWrFZ4B18qA7yCyspH3K-i_wYV829H7vjiPL5MfYfPpH_6B-SK2n4B93Kxqd83WUMFGeOq_nx2kLmjQU8I4ARaE_xYds88pfpEkkbAOUwPSCfVRWsd2cBPHLeWPqwvYaYPTJZoqu1XAa8xed5D6wAt8dp3GVIhobbtNmFu-Prc2351PVZMfHmca6oPnyZLNtibvNvOtfpbs0r7ZLjB-gjEJqUkhCk0Xh9Upw"/>
</div>
<!-- Typography -->
<div class="text-center space-y-4 max-w-sm" id="text-container">
<h1 class="font-headline-sm text-[28px] leading-[36px] font-semibold text-on-surface opacity-0 translate-y-4 transition-all duration-700 ease-out delay-300" id="welcome-title">
                Welcome to Obsidian.
            </h1>
<p class="font-body-lg text-on-surface-variant opacity-0 translate-y-4 transition-all duration-700 ease-out delay-500" id="welcome-subtitle">
                Let's set up your private profile and secure your workspace.
            </p>
</div>
</div>
<!-- Actions -->
<div class="px-6 pb-12 z-10 w-full max-w-sm mx-auto opacity-0 translate-y-8 transition-all duration-700 ease-out delay-700" id="action-container">
<button class="w-full flex items-center justify-center gap-3 bg-primary text-on-primary font-body-md font-medium py-4 px-6 rounded-lg transition-colors duration-200 active:bg-primary-container group shadow-md" onclick="startSetup(this)">
<span>Start Setup</span>
<span class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</button>
<p class="text-center font-label-caps text-on-surface-variant mt-6 opacity-60">
            End-to-End Encrypted
        </p>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Trigger entrance animations
        requestAnimationFrame(() => {
            const elements = ['welcome-title', 'welcome-subtitle', 'action-container'];
            elements.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.classList.remove('opacity-0', 'translate-y-4', 'translate-y-8');
                }
            });
        });
    });

    function startSetup(btn) {
        // Simple loading state
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span class="ml-2">Initializing...</span>';
        btn.classList.add('opacity-80', 'pointer-events-none');
        
        // Simulate navigation
        setTimeout(() => {
            btn.innerHTML = originalContent;
            btn.classList.remove('opacity-80', 'pointer-events-none');
        }, 1500);
    }
</script></main></body></html>
