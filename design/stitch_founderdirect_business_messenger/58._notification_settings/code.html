<script>
  // Simple interaction for toggles
  document.querySelectorAll('label').forEach(label => {
    label.addEventListener('click', function(e) {
      e.preventDefault(); // Prevent default label click behavior for custom styling
      
      const toggleBg = this.querySelector('div.relative.w-12');
      const toggleKnob = toggleBg.querySelector('div.absolute');
      const icon = this.querySelector('.material-symbols-outlined');
      
      const isOff = toggleBg.classList.contains('bg-surface-variant');
      
      if (isOff) {
        // Turn ON
        toggleBg.classList.remove('bg-surface-variant');
        toggleBg.classList.add('bg-primary-fixed');
        
        toggleKnob.classList.remove('bg-outline');
        toggleKnob.classList.add('bg-primary', 'translate-x-6');
        
        icon.classList.remove('text-outline');
        icon.classList.add('text-primary-fixed-dim');
        
        if (icon.textContent === 'visibility_off') icon.textContent = 'visibility';
        
      } else {
        // Turn OFF
        toggleBg.classList.remove('bg-primary-fixed');
        toggleBg.classList.add('bg-surface-variant');
        
        toggleKnob.classList.remove('bg-primary', 'translate-x-6');
        toggleKnob.classList.add('bg-outline');
        
        icon.classList.remove('text-primary-fixed-dim');
        icon.classList.add('text-outline');
        
        if (icon.textContent === 'visibility') icon.textContent = 'visibility_off';
      }
    });
  });
