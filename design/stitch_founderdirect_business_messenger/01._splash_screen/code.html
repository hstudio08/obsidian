<!-- Pulse Effect Overlay -->
<div class="absolute inset-0 bg-primary/20 animate-pulse mix-blend-overlay"></div>
</div>
<!-- Brand Name (Optional based on logo composition, but adds to auth feel) -->
<h1 class="text-headline-sm text-on-primary font-headline-sm tracking-widest uppercase opacity-0 transition-opacity duration-1000 ease-in-out" id="brand-text">
            Obsidian
        </h1>
</div>
<!-- Footer Text -->
<div class="absolute bottom-8 left-0 right-0 text-center">
<p class="text-label-caps text-on-primary/50 font-label-caps uppercase tracking-widest opacity-0 transition-opacity duration-1000 ease-in-out delay-500" id="footer-text">
            Secure Private Messaging
        </p>
</div>
<!-- Background Decoration (Subtle grid/particles for high-end feel) -->
<div class="absolute inset-0 pointer-events-none opacity-5">
<svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Fade in text elements after a short delay for sequential loading effect
        setTimeout(() => {
            const brandText = document.getElementById('brand-text');
            if (brandText) {
                brandText.style.opacity = '1';
                brandText.style.transform = 'translateY(0)';
            }
        }, 300);

        setTimeout(() => {
            const footerText = document.getElementById('footer-text');
            if (footerText) {
                footerText.style.opacity = '1';
            }
        }, 800);

        // Continuous subtle pulse on logo container
        const logoContainer = document.getElementById('logo-container');
        if (logoContainer) {
            logoContainer.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(1.02)' },
                { transform: 'scale(1)' }
            ], {
                duration: 4000,
                iterations: Infinity,
                easing: 'ease-in-out'
            });
        }
    });
