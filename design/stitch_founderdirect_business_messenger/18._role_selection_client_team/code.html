<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-background"><div class="bg-pattern"></div><main class="relative min-h-screen"><div class="flex flex-col w-full h-full pb-safe px-container-margin">
<div class="flex-1 flex flex-col pt-8">
<div class="mb-stack-md">
<h1 class="font-headline-sm text-headline-sm text-on-background mb-2">Select Your Role</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Choose how you will be using the platform to configure your workspace.</p>
</div>
<div class="flex flex-col gap-4 mt-4" id="role-cards-container">
<!-- Client Role Card -->
<button aria-pressed="false" class="role-card group text-left relative overflow-hidden rounded-xl bg-surface-container border border-transparent transition-all duration-200 ease-out p-6" data-role="client">
<div class="flex items-start justify-between mb-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed transition-colors duration-200 ease-out group-[.selected]:bg-primary group-[.selected]:text-on-primary">
<span class="material-symbols-outlined text-2xl">cases</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all duration-200 ease-out group-[.selected]:border-primary group-[.selected]:bg-primary">
<span class="material-symbols-outlined text-on-primary text-sm opacity-0 transition-opacity duration-200 ease-out group-[.selected]:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<h2 class="font-body-lg text-body-lg text-on-surface mb-1">Client</h2>
<p class="font-body-md text-body-md text-on-surface-variant">I am here to review proposals, track project progress, and communicate with my service team.</p>
<div class="absolute inset-0 border-2 border-transparent rounded-xl transition-colors duration-200 ease-out group-[.selected]:border-primary pointer-events-none"></div>
</button>
<!-- Team Role Card -->
<button aria-pressed="false" class="role-card group text-left relative overflow-hidden rounded-xl bg-surface-container border border-transparent transition-all duration-200 ease-out p-6" data-role="team">
<div class="flex items-start justify-between mb-4">
<div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed transition-colors duration-200 ease-out group-[.selected]:bg-primary group-[.selected]:text-on-primary">
<span class="material-symbols-outlined text-2xl">groups</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all duration-200 ease-out group-[.selected]:border-primary group-[.selected]:bg-primary">
<span class="material-symbols-outlined text-on-primary text-sm opacity-0 transition-opacity duration-200 ease-out group-[.selected]:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<h2 class="font-body-lg text-body-lg text-on-surface mb-1">Team Member</h2>
<p class="font-body-md text-body-md text-on-surface-variant">I am here to manage tasks, collaborate internally, and deliver work to clients.</p>
<div class="absolute inset-0 border-2 border-transparent rounded-xl transition-colors duration-200 ease-out group-[.selected]:border-primary pointer-events-none"></div>
</button>
</div>
</div>
<div class="pt-6 mt-auto">
<button class="w-full h-14 bg-surface-container-highest text-on-surface-variant font-label-caps text-label-caps rounded-lg transition-all duration-200 ease-out flex items-center justify-center gap-2 pointer-events-none opacity-50" disabled="" id="continue-btn">
<span>CONTINUE</span>
<span class="material-symbols-outlined text-xl transition-transform duration-200 ease-out group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.role-card');
    const continueBtn = document.getElementById('continue-btn');
    let selectedRole = null;

    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Deselect all
        cards.forEach(c => {
          c.classList.remove('selected', 'bg-surface-container-lowest', 'shadow-md');
          c.classList.add('bg-surface-container');
          c.setAttribute('aria-pressed', 'false');
        });

        // Select clicked
        card.classList.add('selected', 'bg-surface-container-lowest', 'shadow-md');
        card.classList.remove('bg-surface-container');
        card.setAttribute('aria-pressed', 'true');
        
        selectedRole = card.dataset.role;

        // Enable button
        continueBtn.disabled = false;
        continueBtn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant', 'pointer-events-none', 'opacity-50');
        continueBtn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-on-background');
      });
    });

    continueBtn.addEventListener('click', () => {
      if (selectedRole) {
        // Handle continue action, e.g., transition or console log
        continueBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span><span>PROCESSING...</span>`;
        setTimeout(() => {
           continueBtn.innerHTML = `<span>CONTINUE</span><span class="material-symbols-outlined text-xl">arrow_forward</span>`;
        }, 1500);
      }
    });
  });
</script></main></body></html>
