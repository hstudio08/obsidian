<script>
    // Subtle entry interaction
    function triggerEntrySequence(btn) {
      btn.style.transform = 'scale(0.98)';
      
      // Create a ripple effect ring from the button
      const ripple = document.createElement('div');
      ripple.className = 'absolute inset-0 rounded-lg bg-on-primary/20 pointer-events-none';
      ripple.style.animation = 'pulseRing 0.6s ease-out forwards';
      btn.appendChild(ripple);
      
      setTimeout(() => {
        btn.style.transform = 'scale(1)';
        // Simulate navigation/transition out

        document.body.style.transition = 'opacity 0.4s ease-out';

    }
