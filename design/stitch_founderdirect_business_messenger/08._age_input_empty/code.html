ody-md": ["Geist"], "label-caps": ["JetBrains Mono"], "message-text": ["Geist"], "headline-sm": ["Geist"], "body-lg": ["Geist"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }], "message-text": ["15px", { "lineHeight": "22px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }] } } } }</script><style>@layer base { body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } .bg-pattern { background-image: url('https://lh3.googleusercontent.com/aida/AP1WRLutJjoQ7YlMQy0y97wJgRFYuz1-hEVrc1Vj10EFMrjuhaYMzx5JLzrnaiYsJ3OZwynZYc5N2auPpp1-tWVCgAHujM5kUcQ-exgZMVgH68fCrfsg8OI5YWCuqrSUib_aFWDKgt0TA7voYYVvu12BWSrxEXa0tzFb1YqnU-tHytKyDqSv4NlIzHO0gPR7NF6r4RNfUM9957zdZop3tkohoiIJLHfNC5Agmx91VboJDGD3zaZ93L-rsNJq_Q'); background-size: 40px 40px; opacity: 0.03; pointer-events: none; position: fixed; inset: 0; z-index: -1; } .page-transition { transition: opacity 200ms ease-out, transform 200ms ease-out; }</style></head><body class="bg-background font-body-md text-on-background"><div class="bg-pattern"></div><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-container-margin flex items-center justify-between"><div class="flex items-center gap-stack-sm"><img alt="Obsidian Primary Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJvSbfYcdyMlI4obCYCexioELfFwQ6YbIccmL7aasJneuhVAF5m8lEMkESn3pY9qhGZhVrJ8VgrrPOhlWc9XmHUBan0BGE2T7DMHvPuisDRWttKY9d8aytb4qvCwg4O_rlbmQl2YHqoqgJi8ApKVXCrLBHkyclHsAD_Yeu6F5dRiki0KgEQS6ujj9ipQt3Em0bdGa_xXY9_n0DqPeWo9I7lYV3ts314Gz4vQR4L7nIwsEVQaR5l3UK"/><span class="font-headline-sm text-headline-sm text-on-surface">Settings</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="relative pt-16 pb-20 min-h-screen page-transition"><div class="flex flex-col w-full h-full px-container-margin py-stack-md justify-between" id="age-input-container">
<div class="flex flex-col gap-stack-md mt-8">
<h1 class="font-headline-sm text-headline-sm text-on-background tracking-tight">How old are you?</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
            This helps us tailor your experience and ensure you're eligible for our services.
        </p>
<div class="relative mt-8 group">
<input autocomplete="off" class="w-full bg-transparent font-headline-sm text-[32px] leading-tight text-on-background placeholder-on-surface-variant/30 focus:outline-none transition-colors border-b-2 border-surface-variant focus:border-primary pb-2 rounded-none" id="age-input" inputmode="numeric" pattern="[0-9]*" placeholder="00" type="number"/>
<div class="absolute bottom-[-1.5rem] left-0 w-full flex justify-between items-center opacity-0 transition-opacity duration-300" id="validation-hint">
<span class="font-label-caps text-[10px] text-error" id="error-message">Must be 18 or older</span>
</div>
<div class="absolute right-0 top-1/2 -translate-y-[80%] opacity-0 transition-opacity duration-200 pointer-events-none" id="success-icon">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<div class="flex flex-col gap-stack-sm mt-auto pb-4 pt-12">
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-caps text-label-caps uppercase tracking-wider transition-all duration-300 ease-out opacity-40 cursor-not-allowed hover:bg-on-primary-fixed-variant active:scale-[0.98] flex items-center justify-center gap-2" disabled="" id="continue-btn">
<span>Continue</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</button>
<p class="text-center font-label-caps text-[10px] text-on-surface-variant mt-4 opacity-60">
            Your age is private and never shared.
        </p>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('age-input');
        const btn = document.getElementById('continue-btn');
        const hint = document.getElementById('validation-hint');
        const errorMsg = document.getElementById('error-message');
        const successIcon = document.getElementById('success-icon');
        
        // Add a subtle entrance animation to the container
        const container = document.getElementById('age-input-container');
        container.style.opacity = '0';
        container.style.transform = 'translateY(10px)';
        
        requestAnimationFrame(() => {
            container.style.transition = 'opacity 400ms ease-out, transform 400ms ease-out';
            container.style.opacity = '1';
            container.style.transform = 'translateY(0)';
            
            // Auto-focus the input after a slight delay for better UX
            setTimeout(() => {
                input.focus();
            }, 300);
        });

        // Input validation and interaction
        input.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, ''); // Allow only numbers
            
            // Limit to 3 digits
            if (val.length > 3) {
                val = val.slice(0, 3);
            }
            e.target.value = val;

            const age = parseInt(val, 10);
            
            if (!val) {
                // Empty state
                btn.disabled = true;
                btn.classList.add('opacity-40', 'cursor-not-allowed');
                btn.classList.remove('shadow-md', 'hover:shadow-lg');
                hint.classList.remove('opacity-100');
                successIcon.classList.remove('opacity-100');
                input.classList.remove('border-error');
            } else if (age < 18) {
                // Invalid state (underage)
                btn.disabled = true;
                btn.classList.add('opacity-40', 'cursor-not-allowed');
                btn.classList.remove('shadow-md', 'hover:shadow-lg');
                hint.classList.add('opacity-100');
                errorMsg.textContent = 'You must be at least 18 years old.';
                input.classList.add('border-error');
                input.classList.remove('focus:border-primary');
                successIcon.classList.remove('opacity-100');
                
                // Subtle shake animation for error feedback
                if(val.length >= 2) {
                    input.style.transform = 'translateX(-4px)';
                    setTimeout(() => input.style.transform = 'translateX(4px)', 50);
                    setTimeout(() => input.style.transform = 'translateX(-2px)', 100);
                    setTimeout(() => input.style.transform = 'translateX(2px)', 150);
                    setTimeout(() => input.style.transform = 'translateX(0)', 200);
                }

            } else if (age > 120) {
                 // Invalid state (unrealistic age)
                btn.disabled = true;
                btn.classList.add('opacity-40', 'cursor-not-allowed');
                btn.classList.remove('shadow-md', 'hover:shadow-lg');
                hint.classList.add('opacity-100');
                errorMsg.textContent = 'Please enter a valid age.';
                input.classList.add('border-error');
                input.classList.remove('focus:border-primary');
                successIcon.classList.remove('opacity-100');
            } else {
                // Valid state
                btn.disabled = false;
                btn.classList.remove('opacity-40', 'cursor-not-allowed');
                btn.classList.add('shadow-md', 'hover:shadow-lg', 'group'); // Add group for hover arrow effect
                hint.classList.remove('opacity-100');
                input.classList.remove('border-error');
                input.classList.add('focus:border-primary');
                
                // Show success checkmark
                successIcon.classList.add('opacity-100');
                
                // Add a little pop effect to the checkmark
                successIcon.style.transform = 'translateY(-80%) scale(0.8)';
                requestAnimationFrame(() => {
                    successIcon.style.transition = 'all 300ms cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    successIcon.style.transform = 'translateY(-80%) scale(1)';
                });
            }
        });
        
        // Prevent default form submission if wrapped in a form later
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!btn.disabled) {
                    // Trigger continue action
                    btn.click();
                }
            }
        });
        
        // Add click ripple effect to button
        btn.addEventListener('click', function(e) {
            if (this.disabled) return;
            
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const ripple = document.createElement('span');
            ripple.style.position = 'absolute';
            ripple.style.width = '0';
            ripple.style.height = '0';
            ripple.style.borderRadius = '50%';
            ripple.style.backgroundColor = 'rgba(255, 255, 255, 0.3)';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.transition = 'width 0.4s ease-out, height 0.4s ease-out, opacity 0.4s ease-out';
            
            this.style.position = 'relative';
            this.style.overflow = 'hidden';
            this.appendChild(ripple);
            
            // Trigger animation
            requestAnimationFrame(() => {
                ripple.style.width = '300px';
                ripple.style.height = '300px';
                ripple.style.opacity = '0';
            });
            
            setTimeout(() => {
                ripple.remove();
            }, 400);
            
            // Simulate progression
            setTimeout(() => {
                 this.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>';
            }, 150);
        });
    });
</script></main><nav class="fixed bottom-0 w-full z-50 bg-surface/80 backdrop-blur-xl pb-safe shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-bold"><div class="h-14 flex items-center justify-around"><a class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant transition-colors" data-path="chats" href="#"><span class="material-symbols-outlined">chat_bubble</span><span class="font-label-caps text-label-caps uppercase">Chats</span></a><a aria-current="page" class="flex flex-col items-center justify-center w-full h-full transition-colors text-primary font-bold" data-path="settings" href="#"><span class="material-symbols-outlined">settings</span><span class="font-label-caps text-label-caps uppercase">Settings</span></a></div></nav></body></html>
