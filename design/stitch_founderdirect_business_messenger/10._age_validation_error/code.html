line-sm text-headline-sm text-on-surface">Settings</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="relative pt-16 pb-20 min-h-screen page-transition"><div class="flex flex-col w-full h-full px-container-margin py-stack-md bg-background relative overflow-hidden">
<div class="flex flex-col flex-grow items-center justify-center space-y-stack-md mt-12 z-10">
<div class="text-center space-y-stack-sm max-w-[320px]">
<h1 class="font-headline-sm text-headline-sm text-on-background">Verify your age</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your age to continue setting up your Obsidian account.</p>
</div>
<div class="w-full max-w-[320px] space-y-2 mt-8 relative">
<div class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3 transition-colors duration-200" id="age-input-container">
<input class="w-full bg-transparent border-none outline-none font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50" id="age-input" inputmode="numeric" oninput="validateAge()" placeholder="Enter your age" type="number" value="12"/>
<span class="material-symbols-outlined text-error absolute right-4 opacity-100 transition-opacity" id="error-icon">error</span>
</div>
<div class="flex items-start gap-1.5 text-error mt-2 opacity-100 transition-opacity" id="error-message">
<span class="font-body-md text-[13px] leading-tight">You must be at least 18 years old to use Obsidian.</span>
</div>
</div>
</div>
<div class="w-full mt-auto pt-8 pb-4 z-10 flex justify-center">
<button class="w-full max-w-[320px] bg-surface-container-highest text-on-surface-variant/50 font-label-caps text-label-caps py-4 rounded-xl flex items-center justify-center gap-2 transition-all duration-300 ease-out cursor-not-allowed" disabled="" id="continue-btn">
<span>CONTINUE</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  function validateAge() {
    const input = document.getElementById('age-input');
    const btn = document.getElementById('continue-btn');
    const container = document.getElementById('age-input-container');
    const errorMsg = document.getElementById('error-message');
    const errorIcon = document.getElementById('error-icon');
    const val = parseInt(input.value);

    // Initial state is error, so only clear it if >= 18 or empty
    if (isNaN(val) || val >= 18) {
      btn.disabled = isNaN(val) ? true : false;
      
      if (!isNaN(val) && val >= 18) {
        btn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant/50', 'cursor-not-allowed');
        btn.classList.add('bg-primary', 'text-on-primary');
        container.classList.remove('bg-error-container/20');
        errorMsg.style.opacity = '0';
        errorIcon.style.opacity = '0';
      } else {
         btn.classList.add('bg-surface-container-highest', 'text-on-surface-variant/50', 'cursor-not-allowed');
         btn.classList.remove('bg-primary', 'text-on-primary');
         container.classList.remove('bg-error-container/20');
         errorMsg.style.opacity = '0';
         errorIcon.style.opacity = '0';
      }
    } else {
      // Error state
      btn.disabled = true;
      btn.classList.add('bg-surface-container-highest', 'text-on-surface-variant/50', 'cursor-not-allowed');
      btn.classList.remove('bg-primary', 'text-on-primary');
      
      // Simulate red border via background shift
      container.classList.add('bg-error-container/20');
      errorMsg.style.opacity = '1';
      errorIcon.style.opacity = '1';
      
      // Shake animation
      container.style.transform = 'translateX(5px)';
      setTimeout(() => { container.style.transform = 'translateX(-5px)'; }, 50);
      setTimeout(() => { container.style.transform = 'translateX(5px)'; }, 100);
      setTimeout(() => { container.style.transform = 'translateX(0)'; }, 150);
    }
  }

  // Set initial error state colors
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('age-input-container').classList.add('bg-error-container/20');
  });
</script></main><nav class="fixed bottom-0 w-full z-50 bg-surface/80 backdrop-blur-xl pb-safe shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-bold"><div class="h-14 flex items-center justify-around"><a class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant transition-colors" data-path="chats" href="#"><span class="material-symbols-outlined">chat_bubble</span><span class="font-label-caps text-label-caps uppercase">Chats</span></a><a aria-current="page" class="flex flex-col items-center justify-center w-full h-full transition-colors text-primary font-bold" data-path="settings" href="#"><span class="material-symbols-outlined">settings</span><span class="font-label-caps text-label-caps uppercase">Settings</span></a></div></nav></body></html>
