<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-background"><div class="bg-pattern"></div><main class="relative min-h-screen"><div class="flex flex-col w-full h-full bg-surface">
<div class="px-container-margin py-stack-md flex-1">
<div class="mb-8">
<h2 class="text-headline-sm text-on-surface mb-2">Choose Username</h2>
<p class="text-body-md text-on-surface-variant">Max 10 characters.</p>
</div>
<!-- Empty State -->
<div class="mb-8 relative group">
<label class="block text-label-caps text-on-surface-variant mb-2 ml-1">Username (Empty)</label>
<div class="relative flex items-center bg-surface-container rounded-lg focus-within:bg-surface transition-colors duration-200">
<span class="absolute left-3 text-on-surface-variant text-body-md font-medium select-none">@</span>
<input class="w-full bg-transparent text-body-md text-on-surface placeholder-on-surface-variant py-3 pl-8 pr-12 focus:outline-none rounded-lg" maxlength="10" placeholder="Enter your username" type="text" value=""/>
</div>
<p class="text-label-caps text-on-surface-variant mt-2 ml-1 h-4"></p>
</div>
<!-- Checking State -->
<div class="mb-8 relative group">
<label class="block text-label-caps text-on-surface-variant mb-2 ml-1">Username (Checking)</label>
<div class="relative flex items-center bg-surface-container rounded-lg">
<span class="absolute left-3 text-on-surface-variant text-body-md font-medium select-none">@</span>
<input class="w-full bg-transparent text-body-md text-on-surface py-3 pl-8 pr-12 focus:outline-none rounded-lg" disabled="" maxlength="10" type="text" value="alex"/>
<div class="absolute right-3 flex items-center justify-center w-6 h-6">
<svg class="animate-spin h-5 w-5 text-on-surface-variant" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
</div>
<p class="text-label-caps text-on-surface-variant mt-2 ml-1 h-4">Checking availability...</p>
</div>
<!-- Available State -->
<div class="mb-8 relative group">
<label class="block text-label-caps text-on-surface-variant mb-2 ml-1">Username (Available)</label>
<div class="relative flex items-center bg-surface-container rounded-lg">
<span class="absolute left-3 text-on-surface-variant text-body-md font-medium select-none">@</span>
<input class="w-full bg-transparent text-body-md text-on-surface py-3 pl-8 pr-12 focus:outline-none rounded-lg" maxlength="10" readonly="" type="text" value="alex123"/>
<div class="absolute right-3 text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<p class="text-label-caps text-secondary mt-2 ml-1 h-4">Username is available</p>
</div>
<!-- Taken State -->
<div class="mb-8 relative group">
<label class="block text-label-caps text-error mb-2 ml-1">Username (Taken)</label>
<div class="relative flex items-center bg-error-container/30 rounded-lg">
<span class="absolute left-3 text-error text-body-md font-medium select-none">@</span>
<input class="w-full bg-transparent text-body-md text-on-surface py-3 pl-8 pr-12 focus:outline-none rounded-lg" maxlength="10" readonly="" type="text" value="john"/>
<div class="absolute right-3 text-error">
<span class="material-symbols-outlined text-[20px]">cancel</span>
</div>
</div>
<p class="text-label-caps text-error mt-2 ml-1 h-4">Username is already taken</p>
</div>
</div>
<div class="px-container-margin py-stack-md bg-surface-container-lowest shadow-[0_-4px_24px_-12px_rgba(0,0,0,0.1)] pb-safe relative z-10">
<button class="w-full py-4 rounded-full bg-primary text-on-primary text-body-lg font-medium transition-all duration-200 active:bg-primary/90 flex items-center justify-center gap-2">
      Continue
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div></main></body></html>
